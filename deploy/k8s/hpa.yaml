apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ultibiz-web
  namespace: ultibiz
  labels:
    app.kubernetes.io/name: ultibiz
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ultibiz-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
