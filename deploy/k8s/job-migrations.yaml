# Database migration job. Run before rolling out a new web image:
#   kubectl -n ultibiz apply -f job-migrations.yaml
# Optionally use as an Argo CD hook (uncomment annotations below).
apiVersion: batch/v1
kind: Job
metadata:
  name: ultibiz-migrations
  namespace: ultibiz
  labels:
    app.kubernetes.io/name: ultibiz
    app.kubernetes.io/component: migrations
  annotations:
    # argocd.argoproj.io/hook: PreSync
    # argocd.argoproj.io/hook-delete-policy: HookSucceeded
    {}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ultibiz
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/ultibiz/ultibiz:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ultibiz-config
            - secretRef:
                name: ultibiz-secrets
          # Migrations run via Flyway at app startup in the WAR packaging.
          # This job is a placeholder for a standalone 'java -jar' style
          # migrate step; replace the echo with the real command when the
          # migrations module ships, e.g.:
          #   command: ["java", "-jar", "/opt/ultibiz/migrations.jar"]
          command: ["/bin/sh", "-c", "echo 'migrations run at app startup via Flyway; no standalone step'"]
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
