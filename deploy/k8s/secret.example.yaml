# Example Secret — copy to secret.yaml (git-ignored) and fill real values,
# or create out-of-band: kubectl -n ultibiz create secret generic ultibiz-secrets ...
apiVersion: v1
kind: Secret
metadata:
  name: ultibiz-secrets
  namespace: ultibiz
  labels:
    app.kubernetes.io/name: ultibiz
type: Opaque
stringData:
  ULTIBIZ_DB_USER: ultibiz
  ULTIBIZ_DB_PASSWORD: change-me
