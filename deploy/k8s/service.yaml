apiVersion: v1
kind: Service
metadata:
  name: ultibiz-web
  namespace: ultibiz
  labels:
    app.kubernetes.io/name: ultibiz
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ultibiz
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
