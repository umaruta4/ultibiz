<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{prj.project}">Projects</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0"><span th:text="${project.code}">PRJ</span> · <span th:text="${project.name}">Name</span></h1>
      <div class="d-flex gap-2 align-items-center">
        <span class="badge" th:classappend="${project.status == 'ACTIVE'} ? 'text-bg-success' : 'text-bg-secondary'"
              th:text="${project.status}">ACTIVE</span>
        <form method="post" th:action="@{/projects/{id}/status(id=${project.id})}" class="d-flex gap-1">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <select class="form-select form-select-sm" name="status">
            <option value="ACTIVE">ACTIVE</option>
            <option value="ON_HOLD">ON_HOLD</option>
            <option value="CLOSED">CLOSED</option>
          </select>
          <button class="btn btn-sm btn-outline-secondary" type="submit" th:text="#{prj.updateStatus}">Update</button>
        </form>
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-6 col-md-3"><div class="ub-card h-100">
        <div class="ub-muted small" th:text="#{prj.hoursTotal}">Hours</div>
        <div class="fs-4 fw-semibold" th:text="${report.hoursTotal}">0</div></div></div>
      <div class="col-6 col-md-3"><div class="ub-card h-100">
        <div class="ub-muted small" th:text="#{prj.labourCost}">Labour cost</div>
        <div class="fs-4 fw-semibold" th:text="${report.labourCost}">0</div></div></div>
      <div class="col-6 col-md-3"><div class="ub-card h-100">
        <div class="ub-muted small" th:text="#{prj.revenue}">Revenue</div>
        <div class="fs-4 fw-semibold" th:text="${report.revenue}">0</div></div></div>
      <div class="col-6 col-md-3"><div class="ub-card h-100">
        <div class="ub-muted small" th:text="#{prj.profitability}">Profitability</div>
        <div class="fs-4 fw-semibold" th:classappend="${report.profitability.signum() < 0} ? 'text-danger'"
             th:text="${report.profitability}">0</div>
        <div class="ub-muted small" th:text="#{prj.budgetUsage} + ' ' + ${report.budgetUsagePercent} + '%'">usage</div></div></div>
    </div>

    <div class="row g-3">
      <div class="col-12 col-lg-4">
        <div class="ub-card mb-3">
          <h2 class="fs-6 mb-2" th:text="#{prj.wbs}">WBS</h2>
          <ul class="list-unstyled small mb-2">
            <li th:each="item : ${wbs}">
              <span class="fw-semibold" th:text="${item.code}">WBS-1</span>
              <span th:text="${item.name}">name</span>
              <span class="ub-muted" th:text="'(' + ${item.budgetHours} + ' h)'">(0 h)</span>
            </li>
          </ul>
          <form method="post" th:action="@{/projects/{id}/wbs(id=${project.id})}" class="vstack gap-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input class="form-control form-control-sm" name="code" th:placeholder="#{prj.code}" required>
            <input class="form-control form-control-sm" name="name" th:placeholder="#{prj.name}" required>
            <input class="form-control form-control-sm" name="budgetHours" type="number" step="0.5" min="0" th:placeholder="#{prj.budgetHours}">
            <button class="btn btn-sm btn-outline-primary" type="submit" th:text="#{prj.addWbs}">Add WBS</button>
          </form>
        </div>

        <div class="ub-card">
          <h2 class="fs-6 mb-2" th:text="#{prj.assignments}">Team</h2>
          <ul class="list-unstyled small mb-2">
            <li th:each="assignment : ${assignments}">
              <span th:text="${assignment.employeeId}">emp</span> ·
              <span th:text="${assignment.role}">role</span> ·
              <span class="ub-muted" th:text="${assignment.hoursPerWeek} + ' h/w'">0</span>
            </li>
          </ul>
          <form method="post" th:action="@{/projects/{id}/assignments(id=${project.id})}" class="vstack gap-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <select class="form-select form-select-sm" name="employeeId" required>
              <option th:each="employee : ${employees}" th:value="${employee.id}"
                      th:text="${employee.displayName()}">Employee</option>
            </select>
            <input class="form-control form-control-sm" name="role" th:placeholder="#{prj.role}">
            <input class="form-control form-control-sm" name="hoursPerWeek" type="number" step="0.5" min="0.5" max="80" th:placeholder="#{prj.hoursPerWeek}" required>
            <button class="btn btn-sm btn-outline-primary" type="submit" th:text="#{prj.assign}">Assign</button>
          </form>
        </div>
      </div>

      <div class="col-12 col-lg-8">
        <div class="ub-card">
          <h2 class="fs-6 mb-2" th:text="#{prj.milestones}">Milestones</h2>
          <table class="table table-sm align-middle">
            <thead>
              <tr>
                <th th:text="#{prj.code}">Code</th>
                <th th:text="#{prj.name}">Name</th>
                <th th:text="#{prj.dueDate}">Due</th>
                <th class="text-end" th:text="#{prj.amount}">Amount</th>
                <th th:text="#{prj.status}">Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="milestone : ${milestones}">
                <td th:text="${milestone.code}">MS</td>
                <td th:text="${milestone.name}">name</td>
                <td th:text="${milestone.dueDate}">due</td>
                <td class="text-end" th:text="${milestone.amount}">0</td>
                <td><span class="badge" th:classappend="${milestone.status == 'INVOICED'} ? 'text-bg-success' : (${milestone.status == 'REACHED'} ? 'text-bg-info' : 'text-bg-secondary')"
                          th:text="${milestone.status}">PENDING</span></td>
                <td class="text-end">
                  <form th:if="${milestone.status == 'PENDING'}" method="post"
                        th:action="@{/projects/milestones/{id}/reach(id=${milestone.id})}" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="projectId" th:value="${project.id}">
                    <button class="btn btn-sm btn-outline-primary" type="submit" th:text="#{prj.reach}">Reach</button>
                  </form>
                  <form th:if="${milestone.status == 'REACHED' && milestone.amount.signum() > 0}" method="post"
                        th:action="@{/projects/milestones/{id}/invoice(id=${milestone.id})}" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="projectId" th:value="${project.id}">
                    <button class="btn btn-sm btn-success" type="submit" th:text="#{prj.invoice}">Invoice</button>
                  </form>
                  <a th:if="${milestone.journalId != null}" class="btn btn-sm btn-outline-secondary"
                     th:href="@{/accounting/journals/{id}(id=${milestone.journalId})}" th:text="#{prj.journal}">Journal</a>
                </td>
              </tr>
            </tbody>
          </table>
          <form method="post" th:action="@{/projects/{id}/milestones(id=${project.id})}" class="row g-2 mt-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="col-6 col-md-2"><input class="form-control form-control-sm" name="code" th:placeholder="#{prj.code}" required></div>
            <div class="col-6 col-md-3"><input class="form-control form-control-sm" name="name" th:placeholder="#{prj.name}" required></div>
            <div class="col-6 col-md-3"><input class="form-control form-control-sm" name="dueDate" type="date" required></div>
            <div class="col-6 col-md-2"><input class="form-control form-control-sm" name="amount" type="number" step="0.01" min="0" value="0"></div>
            <div class="col-12 col-md-2"><button class="btn btn-sm btn-outline-primary w-100" type="submit" th:text="#{prj.addMilestone}">Add</button></div>
          </form>
        </div>
      </div>
    </div>

  </th:block>
</body>
</html>
