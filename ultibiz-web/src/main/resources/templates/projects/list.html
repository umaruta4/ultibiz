<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{prj.projects}">Projects</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0" th:text="#{prj.projects}">Projects</h1>
      <div class="btn-group btn-group-sm">
        <a class="btn btn-outline-secondary" th:classappend="${status == null} ? 'active'" th:href="@{/projects}" th:text="#{prj.all}">All</a>
        <a class="btn btn-outline-secondary" th:classappend="${status == 'ACTIVE'} ? 'active'" th:href="@{/projects(status='ACTIVE')}" th:text="#{prj.active}">Active</a>
        <a class="btn btn-outline-secondary" th:classappend="${status == 'CLOSED'} ? 'active'" th:href="@{/projects(status='CLOSED')}" th:text="#{prj.closed}">Closed</a>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-12 col-lg-4">
        <div class="ub-card">
          <h2 class="fs-6 mb-3" th:text="#{prj.create}">New project</h2>
          <form method="post" th:action="@{/projects}" class="vstack gap-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input class="form-control form-control-sm" name="code" th:placeholder="#{prj.code}" required>
            <input class="form-control form-control-sm" name="name" th:placeholder="#{prj.name}" required>
            <label class="ub-muted small mb-0" th:text="#{prj.startDate}">Start</label>
            <input class="form-control form-control-sm" name="startDate" type="date">
            <input class="form-control form-control-sm" name="budgetAmount" type="number" step="0.01" min="0" th:placeholder="#{prj.budget}">
            <input class="form-control form-control-sm" name="billingRate" type="number" step="0.01" min="0" th:placeholder="#{prj.billingRate}">
            <button class="btn btn-sm btn-primary" type="submit" th:text="#{prj.create}">Create</button>
          </form>
        </div>
      </div>
      <div class="col-12 col-lg-8">
        <div class="ub-card">
          <table class="table table-sm align-middle mb-0">
            <thead>
              <tr>
                <th th:text="#{prj.code}">Code</th>
                <th th:text="#{prj.name}">Name</th>
                <th th:text="#{prj.startDate}">Start</th>
                <th class="text-end" th:text="#{prj.budget}">Budget</th>
                <th th:text="#{prj.status}">Status</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="project : ${projects}">
                <td><a th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.code}">PRJ</a></td>
                <td th:text="${project.name}">Name</td>
                <td th:text="${project.startDate}">date</td>
                <td class="text-end" th:text="${project.budgetAmount}">0</td>
                <td><span class="badge" th:classappend="${project.status == 'ACTIVE'} ? 'text-bg-success' : 'text-bg-secondary'"
                          th:text="${project.status}">ACTIVE</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </th:block>
</body>
</html>
