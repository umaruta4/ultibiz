<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{ai.assistant}">Assistant</title>
</head>
<body>
  <th:block id="page-content">

    <h1 class="fs-4 mb-3" th:text="#{ai.usage}">Usage</h1>
    <div class="row g-3">
      <div class="col-6 col-md-3"><div class="ub-card"><div class="ub-muted small" th:text="#{ai.calls}">Calls</div><div class="fs-4" th:text="${usage.calls}">0</div></div></div>
      <div class="col-6 col-md-3"><div class="ub-card"><div class="ub-muted small" th:text="#{ai.promptTokens}">Prompt tokens</div><div class="fs-4" th:text="${usage.promptTokens}">0</div></div></div>
      <div class="col-6 col-md-3"><div class="ub-card"><div class="ub-muted small" th:text="#{ai.completionTokens}">Completion tokens</div><div class="fs-4" th:text="${usage.completionTokens}">0</div></div></div>
      <div class="col-6 col-md-3"><div class="ub-card"><div class="ub-muted small" th:text="#{ai.cost}">Cost</div><div class="fs-4" th:text="${usage.cost}">0</div></div></div>
    </div>
  </th:block>
</body>
</html>
