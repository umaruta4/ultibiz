<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{ai.assistant}">Assistant</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0" th:text="#{ai.board}">Assistant board</h1>
      <div class="d-flex gap-2">
        <form method="post" th:action="@{/ai/insights/run}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="btn btn-sm btn-outline-secondary" type="submit" th:text="#{ai.runInsights}">Run the rules</button>
        </form>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/ai/usage}" th:text="#{ai.usage}">Usage</a>
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-6 col-md-3">
        <div class="ub-card h-100">
          <div class="ub-muted small" th:text="#{ai.calls}">Calls</div>
          <div class="fs-4 fw-semibold" th:text="${usage.calls}">0</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="ub-card h-100">
          <div class="ub-muted small" th:text="#{ai.tokens}">Tokens</div>
          <div class="fs-4 fw-semibold" th:text="${usage.promptTokens + usage.completionTokens}">0</div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="ub-card h-100">
          <div class="ub-muted small" th:text="#{ai.provider}">Provider</div>
          <div class="fs-6" th:text="${config != null} ? ${config.provider()} + ' / ' + ${config.model()} : '-'">-</div>
          <div class="small ub-muted" th:if="${config != null and config.isExternal()}"
               th:text="#{ai.externalWarning}">This organisation talks to an external provider.</div>
        </div>
      </div>
    </div>

    <div class="ub-card">
      <h2 class="fs-6" th:text="#{ai.insights}">Insights</h2>
      <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
          <thead><tr>
            <th scope="col" th:text="#{ai.severity}">Severity</th>
            <th scope="col" th:text="#{ai.rule}">Rule</th>
            <th scope="col" th:text="#{ai.finding}">Finding</th>
            <th scope="col" th:text="#{ai.evidence}">Evidence</th>
            <th scope="col" th:text="#{ai.action}">Suggested action</th>
          </tr></thead>
          <tbody>
            <tr th:each="i : ${insights}">
              <td><span class="badge text-bg-danger" th:if="${i.severity() == 'CRITICAL'}" th:text="${i.severity()}">CRITICAL</span>
                  <span class="badge text-bg-warning" th:if="${i.severity() == 'WARNING'}" th:text="${i.severity()}">WARNING</span>
                  <span class="badge text-bg-secondary" th:if="${i.severity() == 'INFO'}" th:text="${i.severity()}">INFO</span></td>
              <td class="font-monospace small" th:text="${i.ruleCode()}">RULE</td>
              <td th:text="${i.title()}">-</td>
              <td class="small ub-muted" th:text="${i.evidence()}">-</td>
              <td class="small" th:text="${i.suggestedAction()}">-</td>
            </tr>
            <tr th:if="${#lists.isEmpty(insights)}"><td colspan="5" class="ub-muted text-center" th:text="#{md.noData}">No findings.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </th:block>
</body>
</html>
