<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{dash.savedViews}">Dashboard</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0" th:text="#{dash.savedViews}">Saved views</h1>
    </div>

    <div class="row g-3">
      <div class="col-12 col-lg-4">
        <div class="ub-card">
          <h2 class="fs-6 mb-2" th:text="#{dash.newView}">New view</h2>
          <form method="post" th:action="@{/dashboard/views}" class="vstack gap-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input class="form-control form-control-sm" name="code" th:placeholder="#{dash.code}" required>
            <input class="form-control form-control-sm" name="title" th:placeholder="#{dash.title2}" required>
            <input class="form-control form-control-sm" name="module" th:placeholder="#{dash.module}" required>
            <textarea class="form-control form-control-sm" name="filters" rows="3"
                      th:placeholder="#{dash.filtersExample}"></textarea>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="shared" value="true" id="view-shared">
              <label class="form-check-label" for="view-shared" th:text="#{dash.shared}">Share with the organisation</label>
            </div>
            <button class="btn btn-sm btn-primary" type="submit" th:text="#{dash.save}">Save</button>
          </form>
        </div>
      </div>
      <div class="col-12 col-lg-8">
        <div class="ub-card">
          <table class="table table-sm align-middle mb-0">
            <thead>
              <tr>
                <th th:text="#{dash.code}">Code</th>
                <th th:text="#{dash.title2}">Title</th>
                <th th:text="#{dash.module}">Module</th>
                <th th:text="#{dash.filters}">Filters</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="view : ${views}">
                <td th:text="${view.code}">code</td>
                <td th:text="${view.title}">title</td>
                <td th:text="${view.module}">module</td>
                <td class="small" th:text="${view.filters}">{}</td>
                <td class="text-end">
                  <form method="post" th:action="@{/dashboard/views/{id}/delete(id=${view.id})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{dash.delete}">Delete</button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(views)}">
                <td colspan="5" class="ub-muted" th:text="#{dash.noViews}">No views yet</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </th:block>
</body>
</html>
