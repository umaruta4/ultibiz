<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{kv.documentTitle}">Knowledge</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0">
        <span th:text="${document.title}">Title</span>
        <span class="ub-muted fs-6" th:text="'(' + ${document.code} + ')'">(code)</span>
      </h1>
      <div class="d-flex gap-2">
        <form method="post" th:action="@{/knowledge/{id}/hold(id=${document.id})}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <input type="hidden" name="hold" th:value="${!document.legalHold}">
          <button class="btn btn-sm btn-outline-danger" type="submit"
                  th:text="${document.legalHold} ? #{kv.releaseHold} : #{kv.setHold}">Legal hold</button>
        </form>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/knowledge}" th:text="#{kv.back}">Back</a>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-12 col-lg-5">
        <div class="ub-card">
          <h2 class="fs-6 mb-2" th:text="#{kv.newVersion}">New version</h2>
          <form method="post" th:action="@{/knowledge/{id}/versions(id=${document.id})}" class="vstack gap-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input class="form-control form-control-sm" name="title" th:value="${document.title}" required>
            <input class="form-control form-control-sm" name="note" th:placeholder="#{kv.note}">
            <textarea class="form-control form-control-sm" name="content" rows="8" required
                      th:placeholder="#{kv.content}"></textarea>
            <button class="btn btn-sm btn-primary" type="submit" th:text="#{kv.addVersion}">Add version</button>
          </form>
        </div>
      </div>
      <div class="col-12 col-lg-7">
        <div class="ub-card">
          <h2 class="fs-6 mb-2" th:text="#{kv.versions}">Versions</h2>
          <ul class="list-unstyled small mb-0">
            <li th:each="version : ${versions}" class="py-1">
              <span class="badge text-bg-light border" th:text="'v' + ${version.versionNo}">v1</span>
              <span th:text="${version.title}">title</span>
              <span class="ub-muted" th:text="${version.author} + ' · ' + ${version.createdAt}">author</span>
              <div class="ub-muted" th:text="${version.note}">note</div>
            </li>
            <li th:if="${#lists.isEmpty(versions)}" class="ub-muted" th:text="#{kv.noVersions}">No versions</li>
          </ul>
        </div>
      </div>
    </div>

  </th:block>
</body>
</html>
