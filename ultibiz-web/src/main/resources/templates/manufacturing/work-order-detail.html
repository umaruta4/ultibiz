<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{om.title}">Orders</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="fs-4 mb-0 font-monospace" th:text="${order.orderNumber()}">WO-1</h1>
        <p class="ub-muted small mb-0" th:text="${productNames[order.productId()]}">-</p>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/manufacturing/work-orders}" th:text="#{md.back}">Back</a>
        <form th:if="${order.status() == 'PLANNED'}" method="post" th:action="@{/manufacturing/work-orders/{id}/release(id=${order.id()})}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="btn btn-sm btn-primary" type="submit" th:text="#{mfg.release}">Release</button>
        </form>
        <form th:if="${order.status() == 'RELEASED'}" method="post" th:action="@{/manufacturing/work-orders/{id}/issue(id=${order.id()})}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="btn btn-sm btn-warning" type="submit" th:text="#{mfg.issue}">Issue materials</button>
        </form>
        <form th:if="${order.status() == 'IN_PROGRESS'}" method="post"
              th:action="@{/manufacturing/work-orders/{id}/complete(id=${order.id()})}" class="d-flex gap-2">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <input class="form-control form-control-sm" type="number" step="0.001" min="0.001" name="producedQuantity"
                 th:value="${order.quantity()}" th:attr="aria-label=#{mfg.produced}" style="width:8rem">
          <button class="btn btn-sm btn-success" type="submit" th:text="#{mfg.complete}">Complete</button>
        </form>
      </div>
    </div>
    <div class="alert alert-danger py-2" role="alert" th:if="${error != null}" th:text="${error}">Error</div>
    <div class="ub-card mb-3">
      <dl class="row mb-0">
        <dt class="col-sm-3" th:text="#{om.product}">Product</dt>
        <dd class="col-sm-9" th:text="${productNames[order.productId()]}">-</dd>
        <dt class="col-sm-3" th:text="#{om.quantity}">Quantity</dt>
        <dd class="col-sm-9" th:text="${order.quantity()}">0</dd>
        <dt class="col-sm-3" th:text="#{mfg.produced}">Produced</dt>
        <dd class="col-sm-9" th:text="${order.quantityProduced()}">0</dd>
        <dt class="col-sm-3" th:text="#{mfg.materialCost}">Material cost</dt>
        <dd class="col-sm-9" th:text="${order.materialCost()}">0.00</dd>
        <dt class="col-sm-3" th:text="#{om.status}">Status</dt>
        <dd class="col-sm-9"><span class="badge text-bg-primary" th:text="${order.status()}">-</span></dd>
      </dl>
    </div>
    <h2 class="fs-6" th:text="#{mfg.materials}">Materials</h2>
    <div class="ub-card">
      <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
          <thead><tr>
            <th scope="col" th:text="#{om.product}">Product</th>
            <th scope="col" class="text-end" th:text="#{mfg.required}">Required</th>
            <th scope="col" class="text-end" th:text="#{mfg.issued}">Issued</th>
          </tr></thead>
          <tbody>
            <tr th:each="m : ${materials}">
              <td class="font-monospace" th:text="${productNames[m.productId()]}">-</td>
              <td class="text-end" th:text="${m.quantityRequired()}">0</td>
              <td class="text-end" th:text="${m.quantityIssued()}">0</td>
            </tr>
            <tr th:if="${#lists.isEmpty(materials)}"><td colspan="3" class="ub-muted text-center" th:text="#{md.noData}">No materials.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </th:block>
</body>
</html>
