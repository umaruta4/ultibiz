<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{om.title}">Orders</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0" th:text="#{mfg.title}">Work orders</h1>
      <a class="btn btn-sm btn-primary" th:href="@{/manufacturing/work-orders/new}" th:text="#{om.new}">New</a>
    </div>
    <div class="ub-card mb-3">
      <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
          <thead><tr>
            <th scope="col" th:text="#{om.number}">Number</th>
            <th scope="col" th:text="#{om.product}">Product</th>
            <th scope="col" class="text-end" th:text="#{om.quantity}">Qty</th>
            <th scope="col" class="text-end" th:text="#{mfg.produced}">Produced</th>
            <th scope="col" th:text="#{om.status}">Status</th>
          </tr></thead>
          <tbody>
            <tr th:each="o : ${orders.items()}">
              <td><a class="font-monospace" th:href="@{/manufacturing/work-orders/{id}(id=${o.id()})}" th:text="${o.orderNumber()}">WO-1</a></td>
              <td th:text="${productNames[o.productId()]}">-</td>
              <td class="text-end" th:text="${o.quantity()}">0</td>
              <td class="text-end" th:text="${o.quantityProduced()}">0</td>
              <td><span class="badge text-bg-primary" th:text="${o.status()}">PLANNED</span></td>
            </tr>
            <tr th:if="${#lists.isEmpty(orders.items())}"><td colspan="5" class="ub-muted text-center" th:text="#{md.noData}">No work orders.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </th:block>
</body>
</html>
