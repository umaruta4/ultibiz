<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{om.title}">Orders</title>
</head>
<body>
  <th:block id="page-content">

    <h1 class="fs-4 mb-3" th:text="#{mfg.new}">New work order</h1>
    <div class="alert alert-danger py-2" role="alert" th:if="${error != null}" th:text="${error}">Error</div>
    <form method="post" th:action="@{/manufacturing/work-orders}" class="ub-card">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="row g-3">
        <div class="col-12 col-md-5">
          <label class="form-label" for="productId" th:text="#{om.product}">Product</label>
          <select class="form-select" id="productId" name="productId" required>
            <option value="" th:text="#{om.pickProduct}">— pick —</option>
            <option th:each="p : ${products}" th:value="${p.id()}" th:text="${p.code()} + ' — ' + ${p.name()}">P</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label" for="quantity" th:text="#{om.quantity}">Quantity</label>
          <input class="form-control" type="number" step="0.001" min="0.001" id="quantity" name="quantity" required>
        </div>
        <div class="col-12 col-md-5">
          <label class="form-label" for="warehouseId" th:text="#{om.warehouse}">Warehouse</label>
          <select class="form-select" id="warehouseId" name="warehouseId" required>
            <option value="" th:text="#{om.pickWarehouse}">— pick —</option>
            <option th:each="w : ${warehouses}" th:value="${w.id()}" th:text="${w.code()}">W</option>
          </select>
        </div>
        <div class="col-12 col-md-5">
          <label class="form-label" for="productionLineId" th:text="#{mfg.productionLine}">Production line</label>
          <select class="form-select" id="productionLineId" name="productionLineId">
            <option value="" th:text="#{mfg.noLine}">— none —</option>
            <option th:each="l : ${productionLines}" th:value="${l.id()}" th:text="${l.code()} + ' — ' + ${l.name()}">L</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label" for="plannedStart" th:text="#{mfg.plannedStart}">Planned start</label>
          <input class="form-control" type="date" id="plannedStart" name="plannedStart" th:value="${today}">
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label" for="plannedEnd" th:text="#{mfg.plannedEnd}">Planned end</label>
          <input class="form-control" type="date" id="plannedEnd" name="plannedEnd" th:value="${today}">
        </div>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-primary" type="submit" th:text="#{om.create}">Create</button>
        <a class="btn btn-outline-secondary" th:href="@{/manufacturing/work-orders}" th:text="#{md.cancel}">Cancel</a>
      </div>
    </form>
  </th:block>
</body>
</html>
