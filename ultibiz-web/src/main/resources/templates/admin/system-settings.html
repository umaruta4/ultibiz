<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{admin.system.title}">System settings</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0" th:text="#{admin.system.title}">System settings</h1>
      <form method="post" th:action="@{/admin/settings/system}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-sm btn-primary" type="submit" th:text="#{admin.system.save}">Save</button>
      </form>
    </div>

    <p class="text-muted small mb-3" th:text="#{admin.system.subtitle}"></p>

    <div class="alert alert-warning py-2 small" role="status" th:if="${restartNeeded != null}">
      <span th:text="#{admin.system.restart_needed}">Restart:</span>
      <code th:text="${restartNeeded}">db.host</code>
    </div>

    <form method="post" th:action="@{/admin/settings/system}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <th:block th:each="group : ${groups}">
        <div class="ub-card mt-3">
          <h2 class="fs-6 mb-3" th:text="${group}">The database</h2>

          <div th:each="d : ${definitions}" th:if="${d.group() == group}"
               class="row g-2 align-items-start mb-3 pb-3 border-bottom">
            <div class="col-md-4">
              <label class="form-label small fw-semibold mb-0" th:for="${'value_' + d.key()}"
                     th:text="${d.label()}">Label</label>
              <div class="small text-muted">
                <code th:text="${d.environmentVariable()}">ENV_NAME</code>
                <span class="ms-1" th:text="#{admin.system.environment}">fallback</span>
              </div>
              <div class="small text-muted" th:if="${d.hint() != null and !d.hint().isBlank()}"
                   th:text="${d.hint()}"></div>
              <div class="small text-warning-emphasis" th:if="${d.restartRequired()}"
                   th:text="#{admin.system.restart}">restart</div>
            </div>

            <div class="col-md-8">
              <input th:if="${d.type().name() == 'TEXT'}" class="form-control form-control-sm"
                     type="text" th:id="${'value_' + d.key()}" th:name="${'value_' + d.key()}"
                     th:value="${values[d.key()]}">

              <input th:if="${d.type().name() == 'NUMBER'}" class="form-control form-control-sm"
                     type="number" th:id="${'value_' + d.key()}" th:name="${'value_' + d.key()}"
                     th:value="${values[d.key()]}">

              <select th:if="${d.type().name() == 'BOOLEAN'}" class="form-select form-select-sm"
                      th:id="${'value_' + d.key()}" th:name="${'value_' + d.key()}">
                <option th:each="o : ${d.options()}" th:value="${o}" th:text="${o}"
                        th:selected="${o == values[d.key()]}">true</option>
              </select>

              <select th:if="${d.type().name() == 'SELECT'}" class="form-select form-select-sm"
                      th:id="${'value_' + d.key()}" th:name="${'value_' + d.key()}">
                <option th:each="o : ${d.options()}" th:value="${o}" th:text="${o}"
                        th:selected="${o == values[d.key()]}">value</option>
              </select>

              <div th:if="${d.type().name() == 'PASSWORD'}">
                <input class="form-control form-control-sm" type="password"
                       th:id="${'value_' + d.key()}" th:name="${'value_' + d.key()}" value=""
                       autocomplete="new-password">
                <div class="form-check mt-1" th:if="${secrets.contains(d.key())}">
                  <input class="form-check-input" type="checkbox" th:id="${'clear_' + d.key()}"
                         th:name="${'clear_' + d.key()}" value="true">
                  <label class="form-check-label small text-danger"
                         th:for="${'clear_' + d.key()}" th:text="#{admin.system.secret_remove}">Remove</label>
                </div>
                <div class="small text-muted" th:if="${secrets.contains(d.key())}"
                     th:text="#{admin.system.secret_set}">The secret is set.</div>
              </div>
            </div>
          </div>
        </div>
      </th:block>

      <div class="mt-3">
        <button class="btn btn-sm btn-primary" type="submit" th:text="#{admin.system.save}">Save</button>
      </div>
    </form>

  </th:block>
</body>
</html>
