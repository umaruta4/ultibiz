<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{admin.tenants.title}">Tenants</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0" th:text="#{admin.tenants.title}">Tenants</h1>
    </div>

    <p class="text-muted small mb-3" th:text="#{admin.tenants.subtitle}"></p>

    <div class="ub-card">
      <div class="d-flex flex-wrap justify-content-between gap-2 mb-2">
        <h2 class="fs-6 mb-0" th:text="#{admin.tenants.mode}">Mode</h2>
        <span class="badge bg-secondary" th:text="${perTenantDatabase} ? 'database' : 'single'">single</span>
      </div>
      <p class="small mb-0 text-muted">
        <span th:text="${perTenantDatabase} ? #{admin.tenants.mode_database} : #{admin.tenants.mode_single}"></span>
        <span class="d-block mt-1" th:text="#{admin.tenants.identity_note}"></span>
      </p>
    </div>

    <div class="ub-card mt-3">
      <table class="table table-sm align-middle mb-0">
        <thead>
          <tr>
            <th th:text="#{admin.tenants.organization}">Organisation</th>
            <th th:text="#{admin.tenants.database_name}">Database</th>
            <th th:text="#{admin.tenants.status_label}">Status</th>
            <th class="text-end"></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="tenant : ${tenants}">
            <td th:text="${tenant.organizationCode()}">ACME</td>
            <td><code th:text="${tenant.databaseName()}">ultibiz</code></td>
            <td>
              <span class="badge" th:classappend="${tenant.isActive()} ? 'bg-success' : 'bg-secondary'"
                    th:text="${tenant.status()}">ACTIVE</span>
            </td>
            <td class="text-end">
              <form method="post" th:action="@{/admin/settings/tenants/status}" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="organizationCode" th:value="${tenant.organizationCode()}">
                <input type="hidden" name="status" th:value="${tenant.isActive()} ? 'SUSPENDED' : 'ACTIVE'">
                <button class="btn btn-sm btn-outline-secondary" type="submit"
                        th:text="${tenant.isActive()} ? #{admin.tenants.suspend} : #{admin.tenants.activate}">Suspend</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(tenants)}">
            <td colspan="4" class="text-muted text-center py-3" th:text="#{admin.tenants.empty}">No tenant.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="ub-card mt-3">
      <h2 class="fs-6 mb-2" th:text="#{admin.tenants.provision}">Provision a tenant database</h2>
      <p class="small text-muted" th:text="#{admin.tenants.provision_note}"></p>
      <form method="post" th:action="@{/admin/settings/tenants/provision}" class="row g-2 align-items-end">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="col-sm-5">
          <label class="form-label small fw-semibold" for="organizationCode"
                 th:text="#{admin.tenants.org_code}">Organisation code</label>
          <input class="form-control form-control-sm" id="organizationCode" name="organizationCode"
                 type="text" placeholder="ACME" required>
        </div>
        <div class="col-sm-5">
          <label class="form-label small fw-semibold" for="databaseName"
                 th:text="#{admin.tenants.database}">Database name</label>
          <input class="form-control form-control-sm" id="databaseName" name="databaseName"
                 type="text" placeholder="ultibiz_tenant_acme" pattern="[A-Za-z0-9_]{3,60}" required>
        </div>
        <div class="col-sm-2">
          <button class="btn btn-sm btn-primary w-100" type="submit"
                  th:text="#{admin.tenants.provision_button}">Provision</button>
        </div>
      </form>
    </div>
  </th:block>
</body>
</html>
