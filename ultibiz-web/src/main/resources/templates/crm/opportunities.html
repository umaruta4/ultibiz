<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{crm.opportunities}">CRM</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0" th:text="#{crm.opportunities}">Opportunities</h1>
    </div>

    <div class="ub-card">
      <table class="table table-sm align-middle mb-0">
        <thead>
          <tr>
            <th th:text="#{crm.code}">Code</th>
            <th th:text="#{crm.name}">Name</th>
            <th class="text-end" th:text="#{crm.amount}">Amount</th>
            <th th:text="#{crm.stage}">Stage</th>
            <th th:text="#{crm.status}">Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="opportunity : ${opportunities}">
            <td th:text="${opportunity.code}">OPP</td>
            <td th:text="${opportunity.name}">name</td>
            <td class="text-end" th:text="${opportunity.amount}">0</td>
            <td>
              <form method="post" th:action="@{/crm/opportunities/{id}/stage(id=${opportunity.id})}"
                    class="d-flex gap-1">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <select class="form-select form-select-sm" name="stage">
                  <option th:each="stage : ${stages}" th:value="${stage.code}"
                          th:text="${stage.name}">Stage</option>
                </select>
                <input class="form-control form-control-sm" name="lostReason" th:placeholder="#{crm.reason}" style="max-width: 9rem">
                <button class="btn btn-sm btn-outline-primary" type="submit" th:text="#{crm.move}">Move</button>
              </form>
            </td>
            <td>
              <span class="badge" th:classappend="${opportunity.status == 'WON'} ? 'text-bg-success' : (${opportunity.status == 'LOST'} ? 'text-bg-danger' : 'text-bg-secondary')"
                    th:text="${opportunity.status}">OPEN</span>
            </td>
            <td class="text-end">
              <form th:if="${opportunity.status == 'OPEN' and opportunity.salesOrderId == null}" method="post"
                    th:action="@{/crm/opportunities/{id}/handoff(id=${opportunity.id})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-success" type="submit" th:text="#{crm.handoff}">Hand off to sales</button>
              </form>
              <a th:if="${opportunity.salesOrderId != null}" class="btn btn-sm btn-outline-secondary"
                 th:href="@{/orders/sales/{id}(id=${opportunity.salesOrderId})}" th:text="#{crm.salesOrder}">Order</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </th:block>
</body>
</html>
