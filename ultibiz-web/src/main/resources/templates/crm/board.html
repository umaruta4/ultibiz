<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{crm.board}">CRM</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0" th:text="#{crm.board}">CRM board</h1>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/crm/leads}" th:text="#{crm.leads}">Leads</a>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/crm/opportunities}" th:text="#{crm.opportunities}">Opportunities</a>
      </div>
    </div>

    <div class="ub-card mb-3">
      <span class="ub-muted small" th:text="#{crm.weightedPipeline}">Weighted pipeline</span>
      <span class="fs-5 fw-semibold ms-2" th:text="${weighted}">0</span>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-12 col-md-3" th:each="stage : ${stages}">
        <div class="ub-card h-100">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-semibold" th:text="${stage.name}">Stage</span>
            <span class="badge text-bg-secondary" th:text="${stage.probability} + '%'">0%</span>
          </div>
          <div class="vstack gap-2">
            <div class="ub-card p-2" th:each="opportunity : ${board[stage.code()]}">
              <div class="small fw-semibold" th:text="${opportunity.name}">Opportunity</div>
              <div class="small" th:text="${opportunity.amount} + ' ' + ${opportunity.currency}">0</div>
              <div class="ub-muted small" th:text="${opportunity.expectedClose}">date</div>
            </div>
            <div class="ub-muted small" th:if="${#lists.isEmpty(board[stage.code()])}"
                 th:text="#{crm.noItems}">No items</div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-12 col-lg-4">
        <div class="ub-card">
          <h2 class="fs-6 mb-2" th:text="#{crm.logActivity}">Log an activity</h2>
          <form method="post" th:action="@{/crm/activities}" class="vstack gap-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <select class="form-select form-select-sm" name="opportunityId">
              <option value="" th:text="#{crm.noOpportunity}">No opportunity</option>
              <option th:each="opportunity : ${opportunities}" th:value="${opportunity.id}"
                      th:text="${opportunity.name}">Opportunity</option>
            </select>
            <select class="form-select form-select-sm" name="type">
              <option value="CALL">CALL</option>
              <option value="MEETING">MEETING</option>
              <option value="EMAIL">EMAIL</option>
              <option value="TASK">TASK</option>
            </select>
            <input class="form-control form-control-sm" name="subject" th:placeholder="#{crm.subject}" required>
            <input class="form-control form-control-sm" name="dueDate" type="date">
            <button class="btn btn-sm btn-primary" type="submit" th:text="#{crm.log}">Log</button>
          </form>
        </div>
      </div>
      <div class="col-12 col-lg-8">
        <div class="ub-card">
          <h2 class="fs-6 mb-2" th:text="#{crm.openActivities}">Open activities</h2>
          <ul class="list-unstyled small mb-0">
            <li th:each="activity : ${activities}" class="d-flex justify-content-between align-items-center py-1">
              <span>
                <span class="badge text-bg-light border" th:text="${activity.type}">CALL</span>
                <span th:text="${activity.subject}">subject</span>
                <span class="ub-muted" th:text="${activity.dueDate}">due</span>
              </span>
              <form method="post" th:action="@{/crm/activities/{id}/done(id=${activity.id})}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-outline-success" type="submit" th:text="#{crm.done}">Done</button>
              </form>
            </li>
            <li th:if="${#lists.isEmpty(activities)}" class="ub-muted" th:text="#{crm.noItems}">No items</li>
          </ul>
        </div>
      </div>
    </div>

  </th:block>
</body>
</html>
