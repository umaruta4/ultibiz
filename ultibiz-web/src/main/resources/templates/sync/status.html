<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{sync.title}">Sync</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0" th:text="#{sync.title}">Offline &amp; sync</h1>
      <div class="d-flex gap-2">
        <form method="post" th:action="@{/sync/now}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="btn btn-sm btn-primary" type="submit" th:text="#{sync.now}">Sync now</button>
        </form>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/sync/conflicts}" th:text="#{sync.conflicts}">Conflicts</a>
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-12 col-md-4">
        <div class="ub-card h-100">
          <div class="ub-muted small" th:text="#{sync.cursor}">Cursor</div>
          <div class="fs-4 fw-semibold" th:text="${cursor}">0</div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="ub-card h-100">
          <div class="ub-muted small" th:text="#{sync.openConflicts}">Open conflicts</div>
          <div class="fs-4 fw-semibold" th:text="${#lists.size(conflicts)}">0</div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="ub-card h-100">
          <div class="ub-muted small" th:text="#{sync.clientStatus}">Client status</div>
          <div id="sync-status" class="fs-6" data-sync-status>checking</div>
        </div>
      </div>
    </div>

    <div class="ub-card mb-3">
      <h2 class="fs-6" th:text="#{sync.onlineOnly}">Online-only operations</h2>
      <p class="small ub-muted" th:text="#{sync.onlineOnlyHint}">These operations need a connection.</p>
      <ul class="small mb-0">
        <li th:each="e : ${onlineOnly}" th:text="${e}">-</li>
      </ul>
    </div>

    <div class="ub-card">
      <h2 class="fs-6" th:text="#{sync.documents}">Offline documents</h2>
      <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
          <thead><tr>
            <th scope="col" th:text="#{sync.entity}">Entity</th>
            <th scope="col" th:text="#{sync.entityId}">Id</th>
            <th scope="col" th:text="#{sync.rowVersion}">Version</th>
            <th scope="col" th:text="#{sync.data}">Data</th>
          </tr></thead>
          <tbody>
            <tr th:each="d : ${documents}">
              <td th:text="${d.entity()}">-</td>
              <td class="font-monospace" th:text="${d.entityId()}">-</td>
              <td th:text="${d.rowVersion()}">1</td>
              <td class="small ub-muted" th:text="${d.data()}">-</td>
            </tr>
            <tr th:if="${#lists.isEmpty(documents)}"><td colspan="4" class="ub-muted text-center" th:text="#{md.noData}">No documents.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </th:block>
</body>
</html>
