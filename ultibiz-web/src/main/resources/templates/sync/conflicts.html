<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{sync.title}">Sync</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0" th:text="#{sync.conflictCenter}">Conflict center</h1>
      <a class="btn btn-sm btn-outline-secondary" th:href="@{/sync}" th:text="#{sync.title}">Sync</a>
    </div>

    <div class="ub-card" th:each="c : ${conflicts}">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
        <div>
          <span class="fw-semibold" th:text="${c.entity()} + ' ' + ${c.entityId()}">note 1</span>
          <span class="ub-muted small" th:text="' - ' + ${c.status()}">- OPEN</span>
        </div>
        <form method="post" class="d-flex gap-2"
              th:action="@{/sync/conflicts/{id}/resolve(id=${c.id()})}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="btn btn-sm btn-outline-secondary" type="submit" name="resolution"
                  value="KEEP_MINE" th:text="#{sync.keepMine}">Keep mine</button>
          <button class="btn btn-sm btn-outline-secondary" type="submit" name="resolution"
                  value="KEEP_THEIRS" th:text="#{sync.keepTheirs}">Keep theirs</button>
          <button class="btn btn-sm btn-outline-primary" type="submit" name="resolution"
                  value="MERGED" th:text="#{sync.merge}">Merge</button>
        </form>
      </div>
      <table class="table table-sm align-middle mb-0">
        <thead><tr>
          <th scope="col" th:text="#{sync.field}">Field</th>
          <th scope="col" th:text="#{sync.serverValue}">Server</th>
          <th scope="col" th:text="#{sync.clientValue}">Client</th>
        </tr></thead>
        <tbody>
          <tr th:each="field : ${c.differingFields().keySet()}">
            <td th:text="${field}">field</td>
            <td th:text="${c.differingFields().get(field)}">-</td>
            <td th:text="${c.clientData().get(field)}">-</td>
          </tr>
          <tr th:if="${#lists.isEmpty(c.differingFields())}">
            <td colspan="3" class="ub-muted small" th:text="#{sync.noDifferences}">No field differences.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="ub-card" th:if="${#lists.isEmpty(conflicts)}">
      <p class="ub-muted mb-0" th:text="#{sync.noConflicts}">No conflicts.</p>
    </div>
  </th:block>
</body>
</html>
