<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{md.title}">Master Data</title>
</head>
<body>
  <th:block id="page-content">

    <h1 class="fs-4 mb-3" th:text="#{md.warehouses}">Warehouses</h1>

    <form class="row g-2 mb-3" method="get" th:action="@{/master/warehouses}">
      <div class="col-12 col-md-6">
        <input class="form-control" type="search" name="search" th:value="${search}"
               th:placeholder="#{md.searchPlaceholder}" placeholder="Search code or name">
      </div>
      <div class="col-6 col-md-3">
        <div class="form-check mt-2">
          <input class="form-check-input" type="checkbox" name="activeOnly" value="true" id="activeOnly"
                 th:checked="${activeOnly}">
          <label class="form-check-label small" for="activeOnly" th:text="#{md.activeOnly}">Active only</label>
        </div>
      </div>
      <div class="col-6 col-md-3 d-grid align-self-end">
        <button class="btn btn-outline-primary" type="submit" th:text="#{md.filter}">Filter</button>
      </div>
    </form>

    <div class="ub-card mb-3">
      <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
          <thead>
            <tr>
              <th scope="col" th:text="#{md.code}">Code</th>
              <th scope="col" th:text="#{md.name}">Name</th>
              <th scope="col" th:text="#{md.warehouseType}">Type</th>
              <th scope="col" th:text="#{md.country}">Country</th>
              <th scope="col" th:text="#{md.address}">Address</th>
              <th scope="col" th:text="#{md.status}">Status</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="w : ${warehouses.items()}">
              <td class="font-monospace" th:text="${w.code()}">WH-1</td>
              <td th:text="${w.name()}">Main warehouse</td>
              <td th:text="${w.warehouseType()}">STORAGE</td>
              <td th:text="${w.countryCode()}">ID</td>
              <td th:text="${w.address()}">address</td>
              <td>
                <span class="badge text-bg-success" th:if="${w.active()}" th:text="#{md.active}">Active</span>
                <span class="badge text-bg-secondary" th:unless="${w.active()}" th:text="#{md.inactive}">Inactive</span>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(warehouses.items())}">
              <td colspan="6" class="ub-muted text-center" th:text="#{md.noData}">No warehouses found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <h2 class="fs-6 mb-2" th:text="#{md.structure}">Warehouse structure</h2>
    <div class="row g-3 mb-4">
      <div class="col-12 col-lg-6" th:each="s : ${structures}">
        <div class="ub-card h-100">
          <h3 class="fs-6 font-monospace"
              th:text="${s.warehouse().code()} + ' — ' + ${s.warehouse().name()}">WH-1</h3>

          <h4 class="fs-6 mt-3" th:text="#{md.racks}">Racks</h4>
          <ul class="ub-muted small mb-2">
            <li th:each="r : ${s.racks()}" th:text="${r.code()} + ' — ' + ${r.name()}">R-A</li>
            <li th:if="${#lists.isEmpty(s.racks())}" class="ub-muted" th:text="#{md.noData}">none</li>
          </ul>

          <h4 class="fs-6" th:text="#{md.bins}">Bins</h4>
          <ul class="ub-muted small mb-2">
            <li th:each="b : ${s.locations()}"
                th:text="${b.code()} + ' — ' + ${b.name()} + (${b.capacity() != null} ? ' (' + ${b.capacity()} + ')' : '')">
              BIN-A-01</li>
            <li th:if="${#lists.isEmpty(s.locations())}" class="ub-muted" th:text="#{md.noData}">none</li>
          </ul>

          <h4 class="fs-6" th:text="#{md.docks}">Docks</h4>
          <ul class="ub-muted small mb-0">
            <li th:each="d : ${s.docks()}" th:text="${d.code()} + ' — ' + ${d.name()} + ' (' + ${d.dockType()} + ')'">
              DOCK-IN-1</li>
            <li th:if="${#lists.isEmpty(s.docks())}" class="ub-muted" th:text="#{md.noData}">none</li>
          </ul>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center">
      <span class="ub-muted small"
            th:text="#{md.pageOf} + ' ' + ${warehouses.page + 1} + ' / ' + ${warehouses.pageCount()} + ' (' + ${warehouses.total()} + ' ' + #{md.rows} + ')'">
        page 1 / 1</span>
      <div class="btn-group">
        <a class="btn btn-sm btn-outline-secondary" th:disabled="${!warehouses.hasPrevious()}"
           th:href="@{/master/warehouses(search=${search},activeOnly=${activeOnly},page=${warehouses.page - 1},size=${size})}"
           th:text="#{md.previous}">Previous</a>
        <a class="btn btn-sm btn-outline-secondary" th:disabled="${!warehouses.hasNext()}"
           th:href="@{/master/warehouses(search=${search},activeOnly=${activeOnly},page=${warehouses.page + 1},size=${size})}"
           th:text="#{md.next}">Next</a>
      </div>
    </div>
  </th:block>
</body>
</html>
