<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{md.title}">Master Data</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0" th:text="#{md.products}">Products</h1>
      <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-sm btn-outline-secondary"
           th:href="@{/master/products/export.csv(search=${search},type=${type},activeOnly=${activeOnly})}"
           th:text="#{md.export}">Export CSV</a>
        <a class="btn btn-sm btn-primary" th:href="@{/master/products/new}" th:text="#{md.new}">New product</a>
      </div>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/master/products}">
      <div class="col-12 col-md-5">
        <input class="form-control" type="search" name="search" th:value="${search}"
               th:placeholder="#{md.searchPlaceholder}" placeholder="Search code or name">
      </div>
      <div class="col-8 col-md-3">
        <select class="form-select" name="type">
          <option value="" th:text="#{md.all}">All</option>
          <option value="GOODS" th:text="GOODS" th:selected="${type == 'GOODS'}">GOODS</option>
          <option value="SERVICE" th:text="SERVICE" th:selected="${type == 'SERVICE'}">SERVICE</option>
          <option value="KIT" th:text="KIT" th:selected="${type == 'KIT'}">KIT</option>
        </select>
      </div>
      <div class="col-4 col-md-2">
        <div class="form-check mt-2">
          <input class="form-check-input" type="checkbox" name="activeOnly" value="true" id="activeOnly"
                 th:checked="${activeOnly}">
          <label class="form-check-label small" for="activeOnly" th:text="#{md.activeOnly}">Active only</label>
        </div>
      </div>
      <div class="col-12 col-md-2 d-grid align-self-end">
        <button class="btn btn-outline-primary" type="submit" th:text="#{md.filter}">Filter</button>
      </div>
    </form>

    <div class="ub-card mb-3">
      <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
          <thead>
            <tr>
              <th scope="col" th:text="#{md.code}">Code</th>
              <th scope="col" th:text="#{md.name}">Name</th>
              <th scope="col" th:text="#{md.productType}">Type</th>
              <th scope="col" th:text="#{md.uom}">UoM</th>
              <th scope="col" class="text-end" th:text="#{md.standardCost}">Standard cost</th>
              <th scope="col" th:text="#{md.currency}">Currency</th>
              <th scope="col" th:text="#{md.status}">Status</th>
              <th scope="col" class="text-end" th:text="#{md.actions}">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p : ${products.items()}">
              <td class="font-monospace" th:text="${p.code()}">BRG-1</td>
              <td th:text="${p.name()}">Bearing</td>
              <td th:text="${p.productType()}">GOODS</td>
              <td th:text="${p.uomCode()}">PCS</td>
              <td class="text-end" th:text="${p.standardCost()}">0.00</td>
              <td th:text="${p.currency()}">IDR</td>
              <td>
                <span class="badge text-bg-success" th:if="${p.active()}" th:text="#{md.active}">Active</span>
                <span class="badge text-bg-secondary" th:unless="${p.active()}" th:text="#{md.inactive}">Inactive</span>
              </td>
              <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/master/products/{id}/edit(id=${p.id()})}" th:text="#{md.edit}">Edit</a>
                <form class="d-inline" method="post" th:action="@{/master/products/{id}/delete(id=${p.id()})}"
                      onsubmit="return confirm('Delete this product?');">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                  <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{md.delete}">Delete</button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(products.items())}">
              <td colspan="8" class="ub-muted text-center" th:text="#{md.noData}">No products found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <span class="ub-muted small"
            th:text="#{md.pageOf} + ' ' + ${products.page + 1} + ' / ' + ${products.pageCount()} + ' (' + ${products.total()} + ' ' + #{md.rows} + ')'">
        page 1 / 1</span>
      <div class="btn-group">
        <a class="btn btn-sm btn-outline-secondary" th:disabled="${!products.hasPrevious()}"
           th:href="@{/master/products(search=${search},type=${type},activeOnly=${activeOnly},page=${products.page - 1},size=${size})}"
           th:text="#{md.previous}">Previous</a>
        <a class="btn btn-sm btn-outline-secondary" th:disabled="${!products.hasNext()}"
           th:href="@{/master/products(search=${search},type=${type},activeOnly=${activeOnly},page=${products.page + 1},size=${size})}"
           th:text="#{md.next}">Next</a>
      </div>
    </div>

    <div class="ub-card">
      <h2 class="fs-6" th:text="#{md.import}">Import CSV</h2>
      <form method="post" th:action="@{/master/products/import}" enctype="multipart/form-data" class="row g-2 align-items-end">
        <div class="col-12 col-md-5">
          <input class="form-control form-control-sm" type="file" name="file" accept=".csv,text/csv" required>
        </div>
        <div class="col-6 col-md-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="dryRun" value="true" id="dryRun" checked>
            <label class="form-check-label small" for="dryRun" th:text="#{md.dryRun}">Dry run (validate only)</label>
          </div>
        </div>
        <div class="col-6 col-md-2">
          <button class="btn btn-sm btn-outline-primary" type="submit" th:text="#{md.import}">Import</button>
        </div>
      </form>
    </div>
  </th:block>
</body>
</html>
