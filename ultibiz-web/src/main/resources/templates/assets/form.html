<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{asset.new}">New asset</title>
</head>
<body>
  <th:block id="page-content">

    <h1 class="fs-4 mb-3" th:text="#{asset.new}">New asset</h1>
    <div class="alert alert-danger py-2" role="alert" th:if="${error != null}" th:text="${error}">Error</div>
    <form method="post" th:action="@{/assets}" class="ub-card">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="row g-3">
        <div class="col-12 col-md-4">
          <label class="form-label" for="categoryId" th:text="#{asset.category}">Category</label>
          <select class="form-select" id="categoryId" name="categoryId" required>
            <option value="" th:text="#{om.pickProduct}">- pick -</option>
            <option th:each="c : ${categories}" th:value="${c.id()}"
                    th:text="${c.code()} + ' - ' + ${c.name()} + ' (' + ${c.depreciationMethod()} + ')'">C</option>
          </select>
        </div>
        <div class="col-6 col-md-4">
          <label class="form-label" for="code" th:text="#{asset.code}">Code</label>
          <input class="form-control" type="text" id="code" name="code" required>
        </div>
        <div class="col-6 col-md-4">
          <label class="form-label" for="name" th:text="#{asset.name}">Name</label>
          <input class="form-control" type="text" id="name" name="name" required>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label" for="acquisitionDate" th:text="#{asset.acquisitionDate}">Acquisition date</label>
          <input class="form-control" type="date" id="acquisitionDate" name="acquisitionDate" th:value="${today}" required>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label" for="acquisitionCost" th:text="#{asset.cost}">Cost</label>
          <input class="form-control" type="number" step="0.01" min="0" id="acquisitionCost" name="acquisitionCost" required>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label" for="salvageValue" th:text="#{asset.salvage}">Salvage value</label>
          <input class="form-control" type="number" step="0.01" min="0" id="salvageValue" name="salvageValue">
          <div class="form-text" th:text="#{asset.salvageHint}">Leave empty to use the category rate.</div>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label" for="serialNumber" th:text="#{asset.serialNumber}">Serial number</label>
          <input class="form-control" type="text" id="serialNumber" name="serialNumber">
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label" for="warrantyEnd" th:text="#{asset.warranty}">Warranty end</label>
          <input class="form-control" type="date" id="warrantyEnd" name="warrantyEnd">
        </div>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-primary" type="submit" th:text="#{om.create}">Create</button>
        <a class="btn btn-outline-secondary" th:href="@{/assets}" th:text="#{md.cancel}">Cancel</a>
      </div>
    </form>
  </th:block>
</body>
</html>
