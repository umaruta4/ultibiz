<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{asset.maintenance}">Maintenance</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0" th:text="#{asset.maintenance}">Maintenance</h1>
      <a class="btn btn-sm btn-outline-secondary" th:href="@{/assets}" th:text="#{asset.register}">Asset register</a>
    </div>

    <form method="post" th:action="@{/assets/maintenance}" class="ub-card mb-3">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md-4">
          <label class="form-label" for="assetId" th:text="#{asset.register}">Asset</label>
          <select class="form-select" id="assetId" name="assetId" required>
            <option value="" th:text="#{om.pickProduct}">- pick -</option>
            <option th:each="a : ${assets.items()}" th:value="${a.id()}" th:text="${a.code()} + ' - ' + ${a.name()}">A</option>
          </select>
        </div>
        <div class="col-12 col-md-3">
          <label class="form-label" for="planId" th:text="#{asset.maintenancePlan}">Plan</label>
          <select class="form-select" id="planId" name="planId">
            <option value="" th:text="#{asset.noPlan}">- none -</option>
            <option th:each="p : ${plans}" th:value="${p.id()}" th:text="${p.name()}">P</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label" for="dueDate" th:text="#{asset.dueDate}">Due date</label>
          <input class="form-control" type="date" id="dueDate" name="dueDate" th:value="${today}" required>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label" for="note" th:text="#{asset.note}">Note</label>
          <input class="form-control" type="text" id="note" name="note">
        </div>
        <div class="col-12 col-md-1">
          <button class="btn btn-primary w-100" type="submit" th:text="#{asset.schedule}">Schedule</button>
        </div>
      </div>
    </form>

    <div class="ub-card">
      <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
          <thead><tr>
            <th scope="col" th:text="#{asset.code}">Code</th>
            <th scope="col" th:text="#{asset.dueDate}">Due</th>
            <th scope="col" th:text="#{asset.doneDate}">Done</th>
            <th scope="col" th:text="#{asset.status}">Status</th>
            <th scope="col" class="text-end" th:text="#{asset.cost}">Cost</th>
            <th scope="col"></th>
          </tr></thead>
          <tbody>
            <tr th:each="m : ${maintenance}">
              <td class="font-monospace" th:text="${m.assetId()}">1</td>
              <td th:text="${m.dueDate()}">-</td>
              <td th:text="${m.doneDate()} ?: '-'">-</td>
              <td th:text="${m.status()}">OPEN</td>
              <td class="text-end" th:text="${m.cost()}">0</td>
              <td class="text-end">
                <form method="post" th:if="${m.status() != 'DONE'}"
                      th:action="@{/assets/maintenance/{id}/complete(id=${m.id()})}" class="d-inline">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                  <button class="btn btn-sm btn-outline-secondary" type="submit" th:text="#{asset.complete}">Complete</button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(maintenance)}"><td colspan="6" class="ub-muted text-center" th:text="#{asset.noMaintenance}">No maintenance jobs.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </th:block>
</body>
</html>
