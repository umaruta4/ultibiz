<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{acct.title}">Accounting</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="fs-4 mb-0 font-monospace" th:text="${journal.journalNumber()}">JV-2026-000001</h1>
        <p class="ub-muted small mb-0" th:text="${journal.description()} ?: '-'">-</p>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/accounting/journals}" th:text="#{md.back}">Back</a>
        <form th:if="${journal.status() != 'REVERSED'}" method="post"
              th:action="@{/accounting/journals/{id}/reverse(id=${journal.id()})}"
              onsubmit="return confirm('Reverse this journal?');">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{acct.reverse}">Reverse</button>
        </form>
      </div>
    </div>

    <div class="ub-card mb-3">
      <dl class="row mb-0">
        <dt class="col-sm-3" th:text="#{acct.date}">Date</dt>
        <dd class="col-sm-9" th:text="${journal.postingDate()}">2026-11-15</dd>
        <dt class="col-sm-3" th:text="#{acct.type}">Type</dt>
        <dd class="col-sm-9" th:text="${journal.journalType()}">GENERAL</dd>
        <dt class="col-sm-3" th:text="#{acct.reference}">Reference</dt>
        <dd class="col-sm-9" th:text="${journal.reference()} ?: '-'">-</dd>
        <dt class="col-sm-3" th:text="#{acct.status}">Status</dt>
        <dd class="col-sm-9">
          <span class="badge text-bg-success" th:if="${journal.status() == 'POSTED'}" th:text="#{acct.posted}">Posted</span>
          <span class="badge text-bg-secondary" th:unless="${journal.status() == 'POSTED'}" th:text="#{acct.reversed}">Reversed</span>
        </dd>
        <dt class="col-sm-3" th:text="#{acct.postedBy}">Posted by</dt>
        <dd class="col-sm-9" th:text="${journal.postedBy()}">admin</dd>
      </dl>
    </div>

    <div class="ub-card">
      <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
          <thead>
            <tr>
              <th scope="col" th:text="#{acct.account}">Account</th>
              <th scope="col" th:text="#{acct.description}">Description</th>
              <th scope="col" class="text-end" th:text="#{acct.debit}">Debit</th>
              <th scope="col" class="text-end" th:text="#{acct.credit}">Credit</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="l : ${lines}">
              <td class="font-monospace" th:text="${accountNames[l.accountId()]}">1110</td>
              <td th:text="${l.description()} ?: '-'">-</td>
              <td class="text-end" th:text="${l.debit()}">0.00</td>
              <td class="text-end" th:text="${l.credit()}">0.00</td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <th colspan="2" class="text-end" th:text="#{acct.total}">Total</th>
              <th class="text-end" th:text="${journal.totalDebit()}">0.00</th>
              <th class="text-end" th:text="${journal.totalCredit()}">0.00</th>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </th:block>
</body>
</html>
