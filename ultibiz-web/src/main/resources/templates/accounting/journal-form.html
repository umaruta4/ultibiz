<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{acct.title}">Accounting</title>
</head>
<body>
  <th:block id="page-content">

    <h1 class="fs-4 mb-3" th:text="#{acct.newJournal}">New journal</h1>

    <div class="alert alert-danger py-2" role="alert" th:if="${error != null}" th:text="${error}">Error</div>

    <form method="post" th:action="@{/accounting/journals}" class="ub-card">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="row g-3 mb-3">
        <div class="col-6 col-md-3">
          <label class="form-label" for="journalType" th:text="#{acct.type}">Type</label>
          <select class="form-select" id="journalType" name="journalType">
            <option value="GENERAL" th:text="GENERAL">GENERAL</option>
            <option value="SALES" th:text="SALES">SALES</option>
            <option value="PURCHASE" th:text="PURCHASE">PURCHASE</option>
            <option value="RECEIPT" th:text="RECEIPT">RECEIPT</option>
            <option value="PAYMENT" th:text="PAYMENT">PAYMENT</option>
            <option value="OPENING" th:text="OPENING">OPENING</option>
            <option value="CLOSING" th:text="CLOSING">CLOSING</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label" for="postingDate" th:text="#{acct.date}">Posting date</label>
          <input class="form-control" type="date" id="postingDate" name="postingDate" th:value="${today}">
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label" for="country" th:text="#{acct.country}">Country</label>
          <input class="form-control" type="text" id="country" name="country" maxlength="2" th:value="${country}">
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label" for="currency" th:text="#{md.currency}">Currency</label>
          <input class="form-control" type="text" id="currency" name="currency" maxlength="3" th:value="${currency}">
        </div>
        <div class="col-12 col-md-2">
          <label class="form-label" for="reference" th:text="#{acct.reference}">Reference</label>
          <input class="form-control" type="text" id="reference" name="reference" th:value="${reference}">
        </div>
        <div class="col-12">
          <label class="form-label" for="description" th:text="#{acct.description}">Description</label>
          <input class="form-control" type="text" id="description" name="description" th:value="${description}">
        </div>
      </div>

      <h2 class="fs-6" th:text="#{acct.lines}">Lines</h2>
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead>
            <tr>
              <th scope="col" th:text="#{acct.account}">Account</th>
              <th scope="col" class="text-end" th:text="#{acct.debit}">Debit</th>
              <th scope="col" class="text-end" th:text="#{acct.credit}">Credit</th>
              <th scope="col" th:text="#{acct.description}">Description</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="i : ${#numbers.sequence(1, lineCount)}">
              <td>
                <select class="form-select form-select-sm" th:name="${'line' + i + 'AccountId'}">
                  <option value="" th:text="#{acct.pickAccount}">— pick account —</option>
                  <option th:each="a : ${accounts}" th:value="${a.id()}"
                          th:text="${a.code()} + ' — ' + ${a.name()}">1000</option>
                </select>
              </td>
              <td>
                <input class="form-control form-control-sm text-end journal-debit" type="number" step="0.01" min="0"
                       th:name="${'line' + i + 'Debit'}" th:attr="data-journal-line=${i}">
              </td>
              <td>
                <input class="form-control form-control-sm text-end journal-credit" type="number" step="0.01" min="0"
                       th:name="${'line' + i + 'Credit'}" th:attr="data-journal-line=${i}">
              </td>
              <td>
                <input class="form-control form-control-sm" type="text" th:name="${'line' + i + 'Description'}">
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="row g-2 mt-1">
        <div class="col-6 col-md-3">
          <div class="ub-card py-2 px-3">
            <div class="ub-muted small" th:text="#{acct.totalDebit}">Total debit</div>
            <div class="fw-semibold" id="journal-total-debit">0.00</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="ub-card py-2 px-3">
            <div class="ub-muted small" th:text="#{acct.totalCredit}">Total credit</div>
            <div class="fw-semibold" id="journal-total-credit">0.00</div>
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="ub-card py-2 px-3">
            <div class="ub-muted small" th:text="#{acct.difference}">Difference</div>
            <div class="fw-semibold" id="journal-difference">0.00</div>
          </div>
        </div>
      </div>

      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-primary" type="submit" th:text="#{acct.post}">Post journal</button>
        <a class="btn btn-outline-secondary" th:href="@{/accounting/journals}" th:text="#{md.cancel}">Cancel</a>
      </div>
    </form>
  </th:block>
</body>
</html>
