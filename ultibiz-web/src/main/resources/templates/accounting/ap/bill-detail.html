<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{acct.title}">Accounting</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="fs-4 mb-0 font-monospace" th:text="${bill.billNumber()}">BILL-1</h1>
        <p class="ub-muted small mb-0"><span class="badge text-bg-primary" th:text="${bill.status()}">OPEN</span></p>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/accounting/ap}" th:text="#{md.back}">Back</a>
        <a class="btn btn-sm btn-outline-primary" th:href="@{/accounting/ap/{id}/match(id=${bill.id()})}"
           th:text="#{ap.match}">Three-way match</a>
      </div>
    </div>
    <div class="alert alert-danger py-2" role="alert" th:if="${error != null}" th:text="${error}">Error</div>
    <div class="ub-card mb-3">
      <dl class="row mb-0">
        <dt class="col-sm-3" th:text="#{acct.date}">Date</dt>
        <dd class="col-sm-9" th:text="${bill.billDate()}">-</dd>
        <dt class="col-sm-3" th:text="#{ar.dueDate}">Due date</dt>
        <dd class="col-sm-9" th:text="${bill.dueDate()}">-</dd>
        <dt class="col-sm-3" th:text="#{ar.total}">Total</dt>
        <dd class="col-sm-9" th:text="${bill.total()}">0.00</dd>
        <dt class="col-sm-3" th:text="#{ar.paid}">Paid</dt>
        <dd class="col-sm-9" th:text="${bill.paidAmount()}">0.00</dd>
        <dt class="col-sm-3" th:text="#{ar.outstanding}">Outstanding</dt>
        <dd class="col-sm-9 fw-semibold" th:text="${bill.outstanding()}">0.00</dd>
      </dl>
    </div>

    <div class="ub-card" th:if="${bill.status() != 'PAID'}">
      <h2 class="fs-6" th:text="#{ap.recordPayment}">Record payment</h2>
      <form method="post" th:action="@{/accounting/ap/{id}/payment(id=${bill.id()})}" class="row g-2 align-items-end">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="col-6 col-md-3">
          <label class="form-label small" for="amount" th:text="#{ar.amount}">Amount</label>
          <input class="form-control form-control-sm text-end" type="number" step="0.01" min="0.01" id="amount"
                 name="amount" th:value="${bill.outstanding()}" required>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label small" for="bankAccountId" th:text="#{ar.bankAccount}">Bank account</label>
          <select class="form-select form-select-sm" id="bankAccountId" name="bankAccountId">
            <option value="" th:text="#{ar.cash}">Cash on hand</option>
            <option th:each="b : ${banks}" th:value="${b.id()}" th:text="${b.code()} + ' — ' + ${b.name()}">BANK</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label small" for="paymentDate" th:text="#{acct.date}">Date</label>
          <input class="form-control form-control-sm" type="date" id="paymentDate" name="paymentDate" th:value="${today}">
        </div>
        <div class="col-6 col-md-3">
          <button class="btn btn-sm btn-success w-100" type="submit" th:text="#{ap.recordPayment}">Record payment</button>
        </div>
      </form>
    </div>
  </th:block>
</body>
</html>
