<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{acct.title}">Accounting</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="fs-4 mb-0 font-monospace" th:text="${account != null} ? ${account.code()} : '-'">BANK-1</h1>
        <p class="ub-muted small mb-0" th:text="${account != null} ? ${account.name()} : '-'">-</p>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/accounting/bank}" th:text="#{md.back}">Back</a>
        <form method="post" th:action="@{/accounting/bank/{id}/reconcile(id=${account.id()})}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="btn btn-sm btn-primary" type="submit" th:text="#{bank.reconcile}">Reconcile</button>
        </form>
      </div>
    </div>
    <div class="alert alert-info py-2" role="status" th:if="${message != null}" th:text="${message}">Message</div>

    <div class="ub-card mb-3">
      <h2 class="fs-6" th:text="#{bank.statementLines}">Statement lines</h2>
      <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
          <thead><tr>
            <th scope="col" th:text="#{acct.date}">Date</th>
            <th scope="col" th:text="#{bank.description}">Description</th>
            <th scope="col" th:text="#{bank.reference}">Reference</th>
            <th scope="col" class="text-end" th:text="#{bank.amount}">Amount</th>
            <th scope="col" th:text="#{bank.reconciled}">Reconciled</th>
          </tr></thead>
          <tbody>
            <tr th:each="l : ${lines}">
              <td th:text="${l.statementDate()}">-</td>
              <td th:text="${l.description()}">-</td>
              <td th:text="${l.reference()} ?: '-'">-</td>
              <td class="text-end" th:text="${l.amount()}">0.00</td>
              <td>
                <span class="badge text-bg-success" th:if="${l.reconciled()}" th:text="#{bank.reconciled}">Reconciled</span>
                <span class="badge text-bg-warning" th:unless="${l.reconciled()}" th:text="#{bank.unreconciled}">Unreconciled</span>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(lines)}"><td colspan="5" class="ub-muted text-center" th:text="#{md.noData}">No lines.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="ub-card">
      <h2 class="fs-6" th:text="#{bank.import}">Import statement</h2>
      <form method="post" th:action="@{/accounting/bank/{id}/import(id=${account.id()})}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-2">
          <label class="form-label small" for="csv" th:text="#{bank.csv}">CSV (date, description, reference, amount)</label>
          <textarea class="form-control font-monospace" id="csv" name="csv" rows="6" required
                    th:placeholder="#{bank.csvPlaceholder}"></textarea>
        </div>
        <button class="btn btn-sm btn-outline-primary" type="submit" th:text="#{bank.import}">Import</button>
      </form>
    </div>
  </th:block>
</body>
</html>
