<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{acct.title}">Accounting</title>
</head>
<body>
  <th:block id="page-content">

    <h1 class="fs-4 mb-3" th:text="#{acct.periods}">Fiscal periods</h1>

    <div class="alert alert-danger py-2" role="alert" th:if="${error != null}" th:text="${error}">Error</div>

    <div class="ub-card">
      <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
          <thead>
            <tr>
              <th scope="col" th:text="#{acct.period}">Period</th>
              <th scope="col" th:text="#{acct.periodRange}">Range</th>
              <th scope="col" th:text="#{acct.status}">Status</th>
              <th scope="col" th:text="#{acct.closedBy}">Closed by</th>
              <th scope="col" th:text="#{acct.reopenedBy}">Reopened by</th>
              <th scope="col" class="text-end" th:text="#{acct.actions}">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p : ${periods}">
              <td th:text="${p.fiscalYear()} + '/' + ${p.fiscalMonth()}">2026/11</td>
              <td th:text="${p.periodStart()} + ' → ' + ${p.periodEnd()}">2026-11-01 → 2026-11-30</td>
              <td>
                <span class="badge text-bg-success" th:if="${p.status().name() == 'OPEN'}" th:text="#{acct.open}">Open</span>
                <span class="badge text-bg-danger" th:if="${p.status().name() == 'CLOSED'}" th:text="#{acct.closed}">Closed</span>
                <span class="badge text-bg-warning" th:if="${p.status().name() == 'REOPENED'}" th:text="#{acct.reopened}">Reopened</span>
              </td>
              <td th:text="${p.closedBy()} ?: '-'">-</td>
              <td th:text="${p.reopenedBy()} ?: '-'">-</td>
              <td class="text-end">
                <form class="d-inline" th:if="${p.isOpen()}" method="post"
                      th:action="@{/accounting/periods/{id}/close(id=${p.id()})}">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                  <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{acct.close}">Close</button>
                </form>
                <form class="d-inline" th:unless="${p.isOpen()}" method="post"
                      th:action="@{/accounting/periods/{id}/reopen(id=${p.id()})}">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                  <button class="btn btn-sm btn-outline-warning" type="submit" th:text="#{acct.reopen}">Reopen</button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(periods)}">
              <td colspan="6" class="ub-muted text-center" th:text="#{md.noData}">No periods found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </th:block>
</body>
</html>
