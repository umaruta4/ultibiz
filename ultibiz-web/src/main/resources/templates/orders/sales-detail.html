<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{om.title}">Orders</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="fs-4 mb-0 font-monospace" th:text="${order.orderNumber()}">SO-1</h1>
        <p class="ub-muted small mb-0" th:text="${order.notes()} ?: '-'">-</p>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/orders/sales}" th:text="#{md.back}">Back</a>
        <form th:if="${order.status() == 'DRAFT'}" method="post" th:action="@{/orders/sales/{id}/confirm(id=${order.id()})}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="btn btn-sm btn-primary" type="submit" th:text="#{om.confirm}">Confirm</button>
        </form>
        <form th:if="${order.status() == 'CONFIRMED' or order.status() == 'PARTIALLY_SHIPPED'}" method="post"
              th:action="@{/orders/sales/{id}/deliver(id=${order.id()})}"
              onsubmit="return confirm('Deliver all outstanding quantities?');">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="btn btn-sm btn-success" type="submit" th:text="#{om.deliver}">Deliver</button>
        </form>
      </div>
    </div>
    <div class="alert alert-danger py-2" role="alert" th:if="${error != null}" th:text="${error}">Error</div>
    <div class="ub-card mb-3">
      <dl class="row mb-0">
        <dt class="col-sm-3" th:text="#{om.customer}">Customer</dt>
        <dd class="col-sm-9" th:text="${party != null} ? ${party.code()} + ' — ' + ${party.name()} : ${order.partyId()}">-</dd>
        <dt class="col-sm-3" th:text="#{om.date}">Order date</dt>
        <dd class="col-sm-9" th:text="${order.orderDate()}">-</dd>
        <dt class="col-sm-3" th:text="#{om.deliveryDate}">Delivery date</dt>
        <dd class="col-sm-9" th:text="${order.deliveryDate()} ?: '-'">-</dd>
        <dt class="col-sm-3" th:text="#{om.status}">Status</dt>
        <dd class="col-sm-9"><span class="badge text-bg-primary" th:text="${order.status()}">-</span></dd>
      </dl>
    </div>
    <div class="ub-card">
      <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
          <thead><tr>
            <th scope="col" th:text="#{om.product}">Product</th>
            <th scope="col" class="text-end" th:text="#{om.quantity}">Qty</th>
            <th scope="col" class="text-end" th:text="#{om.unitPrice}">Price</th>
            <th scope="col" class="text-end" th:text="#{om.discount}">Discount</th>
            <th scope="col" class="text-end" th:text="#{om.net}">Net</th>
            <th scope="col" class="text-end" th:text="#{om.tax}">Tax</th>
            <th scope="col" class="text-end" th:text="#{om.total}">Total</th>
            <th scope="col" class="text-end" th:text="#{om.shipped}">Shipped</th>
          </tr></thead>
          <tbody>
            <tr th:each="l : ${lines}">
              <td class="font-monospace" th:text="${productNames[l.productId()]} ?: ${l.description()}">-</td>
              <td class="text-end" th:text="${l.quantity()}">0</td>
              <td class="text-end" th:text="${l.unitPrice()}">0.00</td>
              <td class="text-end" th:text="${l.discount()}">0.0000</td>
              <td class="text-end" th:text="${l.netAmount()}">0.00</td>
              <td class="text-end" th:text="${l.taxAmount()}">0.00</td>
              <td class="text-end" th:text="${l.totalAmount()}">0.00</td>
              <td class="text-end" th:text="${l.quantityShipped()}">0</td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <th colspan="4" class="text-end" th:text="#{om.total}">Total</th>
              <th class="text-end" th:text="${order.subtotal()}">0.00</th>
              <th class="text-end" th:text="${order.taxTotal()}">0.00</th>
              <th class="text-end" th:text="${order.total()}">0.00</th>
              <th></th>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </th:block>
</body>
</html>
