<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{hr.employee}">HRM</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0" th:text="#{hr.employee}">Employee</h1>
      <a class="btn btn-sm btn-outline-secondary" th:href="@{/hr}" th:text="#{hr.employees}">Employees</a>
    </div>

    <div class="ub-card">
      <h2 class="fs-6 mb-3" th:text="#{hr.personalData}">Personal data (GDPR scope)</h2>
      <dl class="row mb-0">
        <div th:each="entry : ${employee}" class="col-12 col-md-6">
          <dt class="ub-muted small" th:text="${entry.key}">field</dt>
          <dd th:text="${entry.value}">value</dd>
        </div>
      </dl>
    </div>

  </th:block>
</body>
</html>
