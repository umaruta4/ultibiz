<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{hr.timesheets}">HRM</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0" th:text="#{hr.timesheets}">Timesheets</h1>
    </div>

    <div class="row g-3">
      <div class="col-12 col-lg-4">
        <div class="ub-card">
          <h2 class="fs-6 mb-3" th:text="#{hr.bookTime}">Book time</h2>
          <form method="post" th:action="@{/hr/timesheets}" class="vstack gap-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <select class="form-select form-select-sm" name="employeeId" required>
              <option th:each="employee : ${employees}" th:value="${employee.id}"
                      th:text="${employee.displayName()}">Employee</option>
            </select>
            <input class="form-control form-control-sm" name="workDate" type="date" required>
            <input class="form-control form-control-sm" name="projectCode" th:placeholder="#{hr.projectCode}">
            <input class="form-control form-control-sm" name="hours" type="number" step="0.25" min="0.25" max="24" th:placeholder="#{hr.hours}" required>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="billable" value="true" id="ts-billable">
              <label class="form-check-label" for="ts-billable" th:text="#{hr.billable}">Billable</label>
            </div>
            <input class="form-control form-control-sm" name="description" th:placeholder="#{hr.description}">
            <button class="btn btn-sm btn-primary" type="submit" th:text="#{hr.submit}">Submit</button>
          </form>
        </div>
      </div>
      <div class="col-12 col-lg-8">
        <div class="ub-card">
          <table class="table table-sm align-middle mb-0">
            <thead>
              <tr>
                <th th:text="#{hr.date}">Date</th>
                <th th:text="#{hr.project}">Project</th>
                <th th:text="#{hr.hours}">Hours</th>
                <th th:text="#{hr.billable}">Billable</th>
                <th th:text="#{hr.status}">Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="sheet : ${timesheets}">
                <td th:text="${sheet.workDate}">date</td>
                <td th:text="${sheet.projectCode}">PRJ</td>
                <td th:text="${sheet.hours}">7.5</td>
                <td th:text="${sheet.billable} ? '✓' : '—'">✓</td>
                <td><span class="badge" th:classappend="${sheet.status == 'APPROVED'} ? 'text-bg-success' : 'text-bg-warning'"
                          th:text="${sheet.status}">SUBMITTED</span></td>
                <td class="text-end">
                  <form th:if="${sheet.status == 'SUBMITTED'}" method="post"
                        th:action="@{/hr/timesheets/{id}/approve(id=${sheet.id})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-sm btn-success" type="submit" th:text="#{hr.approve}">Approve</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </th:block>
</body>
</html>
