<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{hr.incidents}">HRM</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0" th:text="#{hr.incidents}">H&amp;S incidents</h1>
    </div>

    <div class="row g-3">
      <div class="col-12 col-lg-4">
        <div class="ub-card">
          <h2 class="fs-6 mb-3" th:text="#{hr.registerIncident}">Register an incident</h2>
          <form method="post" th:action="@{/hr/incidents}" class="vstack gap-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input class="form-control form-control-sm" name="incidentDate" type="date">
            <select class="form-select form-select-sm" name="category">
              <option value="INJURY" th:text="#{hr.catInjury}">Injury</option>
              <option value="NEAR_MISS" th:text="#{hr.catNearMiss}">Near miss</option>
              <option value="EQUIPMENT" th:text="#{hr.catEquipment}">Equipment</option>
              <option value="ENVIRONMENT" th:text="#{hr.catEnvironment}">Environment</option>
            </select>
            <select class="form-select form-select-sm" name="severity">
              <option value="LOW">LOW</option>
              <option value="MEDIUM">MEDIUM</option>
              <option value="HIGH">HIGH</option>
              <option value="CRITICAL">CRITICAL</option>
            </select>
            <textarea class="form-control form-control-sm" name="description" rows="3"
                      th:placeholder="#{hr.description}" required></textarea>
            <button class="btn btn-sm btn-primary" type="submit" th:text="#{hr.register}">Register</button>
          </form>
        </div>
      </div>
      <div class="col-12 col-lg-8">
        <div class="ub-card">
          <table class="table table-sm align-middle mb-0">
            <thead>
              <tr>
                <th th:text="#{hr.date}">Date</th>
                <th th:text="#{hr.category}">Category</th>
                <th th:text="#{hr.severity}">Severity</th>
                <th th:text="#{hr.description}">Description</th>
                <th th:text="#{hr.status}">Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="incident : ${incidents}">
                <td th:text="${incident.incidentDate}">date</td>
                <td th:text="${incident.category}">cat</td>
                <td><span class="badge" th:classappend="${incident.severity == 'CRITICAL' || incident.severity == 'HIGH'} ? 'text-bg-danger' : 'text-bg-secondary'"
                          th:text="${incident.severity}">LOW</span></td>
                <td th:text="${incident.description}">desc</td>
                <td th:text="${incident.status}">OPEN</td>
                <td class="text-end">
                  <form th:if="${incident.status == 'OPEN'}" method="post"
                        th:action="@{/hr/incidents/{id}/status(id=${incident.id})}" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="status" value="INVESTIGATING">
                    <button class="btn btn-sm btn-outline-primary" type="submit" th:text="#{hr.investigate}">Investigate</button>
                  </form>
                  <form th:if="${incident.status != 'CLOSED'}" method="post"
                        th:action="@{/hr/incidents/{id}/status(id=${incident.id})}" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="status" value="CLOSED">
                    <button class="btn btn-sm btn-success" type="submit" th:text="#{hr.close}">Close</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </th:block>
</body>
</html>
