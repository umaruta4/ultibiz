<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{hr.payroll}">HRM</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0" th:text="#{hr.payroll}">Payroll</h1>
    </div>

    <div class="row g-3">
      <div class="col-12 col-lg-4">
        <div class="ub-card">
          <h2 class="fs-6 mb-3" th:text="#{hr.runPayroll}">Run the payroll</h2>
          <form method="post" th:action="@{/hr/payroll/run}" class="vstack gap-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input class="form-control form-control-sm" name="period" th:value="${period}"
                   pattern="\d{4}-\d{2}" placeholder="2026-11" required>
            <button class="btn btn-sm btn-primary" type="submit" th:text="#{hr.run}">Run</button>
          </form>
          <a th:if="${run != null}" class="btn btn-sm btn-outline-secondary mt-2"
             th:href="@{/hr/payroll/export(period=${period})}" th:text="#{hr.exportCsv}">Export CSV</a>
        </div>
      </div>
      <div class="col-12 col-lg-8">
        <div class="ub-card" th:if="${run != null}">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="fs-6 mb-0" th:text="#{hr.runOf} + ' ' + ${run.period()}">Run</h2>
            <span class="badge" th:classappend="${run.status() == 'EXPORTED'} ? 'text-bg-success' : 'text-bg-warning'"
                  th:text="${run.status()}">OPEN</span>
          </div>
          <table class="table table-sm align-middle mb-0">
            <thead>
              <tr>
                <th th:text="#{hr.employeeNo}">No</th>
                <th th:text="#{hr.name}">Name</th>
                <th class="text-end" th:text="#{hr.base}">Base</th>
                <th class="text-end" th:text="#{hr.net}">Net</th>
                <th th:text="#{hr.costCentre}">Cost centre</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="line : ${run.lines()}">
                <td th:text="${line.employee_no}">EMP</td>
                <td th:text="${line.first_name} + ' ' + ${line.last_name}">name</td>
                <td class="text-end" th:text="${line.base_amount}">0</td>
                <td class="text-end fw-semibold" th:text="${line.net_amount}">0</td>
                <td th:text="${line.cost_centre}">CC</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="ub-card ub-muted" th:if="${run == null}" th:text="#{hr.noRun}">No run for this period yet.</div>
      </div>
    </div>

  </th:block>
</body>
</html>
