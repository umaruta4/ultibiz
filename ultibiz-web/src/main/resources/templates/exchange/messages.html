<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{:: title}, ~{:: #page-content})}">
<head>
  <title th:text="#{exchange.title}">Data exchange</title>
</head>
<body>
  <th:block id="page-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="fs-4 mb-0" th:text="#{exchange.messages}">Messages</h1>
      <a class="btn btn-sm btn-outline-secondary" th:href="@{/exchange}" th:text="#{exchange.title}">Data exchange</a>
    </div>

    <form method="get" th:action="@{/exchange/messages}" class="row g-2 mb-3">
      <div class="col-6 col-md-3">
        <select class="form-select form-select-sm" name="status">
          <option value="" th:text="#{exchange.allStatuses}">All statuses</option>
          <option th:each="s : ${ {'RECEIVED','PARSED','VALIDATED','MAPPED','APPLIED','REJECTED','FAILED','DEAD','QUEUED','SENT'} }"
                  th:value="${s}" th:text="${s}" th:selected="${s == status}">RECEIVED</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <select class="form-select form-select-sm" name="direction">
          <option value="" th:text="#{exchange.allDirections}">All directions</option>
          <option value="INBOUND" th:text="#{exchange.inbound}" th:selected="${direction == 'INBOUND'}">INBOUND</option>
          <option value="OUTBOUND" th:text="#{exchange.outbound}" th:selected="${direction == 'OUTBOUND'}">OUTBOUND</option>
        </select>
      </div>
      <div class="col-auto"><button class="btn btn-sm btn-outline-secondary" type="submit" th:text="#{md.filter}">Filter</button></div>
    </form>

    <div class="ub-card">
      <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
          <thead><tr>
            <th scope="col" th:text="#{exchange.id}">Id</th>
            <th scope="col" th:text="#{exchange.direction}">Direction</th>
            <th scope="col" th:text="#{exchange.protocol}">Protocol</th>
            <th scope="col" th:text="#{exchange.documentType}">Document</th>
            <th scope="col" th:text="#{exchange.status}">Status</th>
            <th scope="col" th:text="#{exchange.attempts}">Attempts</th>
            <th scope="col" th:text="#{exchange.error}">Error</th>
          </tr></thead>
          <tbody>
            <tr th:each="m : ${messages.items()}">
              <td><a th:href="@{/exchange/messages/{id}(id=${m.id()})}" th:text="${m.id()}">1</a></td>
              <td th:text="${m.direction()}">INBOUND</td>
              <td th:text="${m.protocol()}">REST_JSON</td>
              <td th:text="${m.documentNumber()} ?: ${m.documentType()}">-</td>
              <td><span class="badge text-bg-secondary" th:text="${m.status()}">RECEIVED</span></td>
              <td th:text="${m.attempts()}">0</td>
              <td class="ub-muted small" th:text="${m.error()}">-</td>
            </tr>
            <tr th:if="${#lists.isEmpty(messages.items())}"><td colspan="7" class="ub-muted text-center" th:text="#{md.noData}">No messages.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-2">
      <span class="ub-muted small" th:text="${messages.page + 1} + ' / ' + ${messages.pageCount()} + ' (' + ${messages.total()} + ')'">1 / 1</span>
      <div class="btn-group btn-group-sm">
        <a class="btn btn-outline-secondary" th:if="${messages.page > 0}"
           th:href="@{/exchange/messages(status=${status},direction=${direction},page=${messages.page - 1},size=${size})}">&laquo;</a>
        <a class="btn btn-outline-secondary" th:if="${messages.page + 1 < messages.pageCount()}"
           th:href="@{/exchange/messages(status=${status},direction=${direction},page=${messages.page + 1},size=${size})}">&raquo;</a>
      </div>
    </div>
  </th:block>
</body>
</html>
