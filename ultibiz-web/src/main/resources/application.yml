spring:
  application:
    name: ultibiz
  datasource:
    url: jdbc:mariadb://${ULTIBIZ_DB_HOST:localhost}:${ULTIBIZ_DB_PORT:3311}/${ULTIBIZ_DB_NAME:ultibiz}?useUnicode=true&characterEncoding=UTF-8
    username: ${ULTIBIZ_DB_USER:ultibiz}
    password: ${ULTIBIZ_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jooq:
    sql-dialect: MARIADB
  # the SMTP relay is **not** configured here on purpose: a spring.mail.host
  # without a value would create a mail sender without a server and the health
  # endpoint would report DOWN (the indicator of the mail server). The relay
  # of the environment is read by the report mailer itself
  # (ultibiz.mail.smtp.*) — the application never uses the mail sender of
  # Spring Boot.
  session:
    store-type: jdbc
    timeout: 8h
    jdbc:
      initialize-schema: never
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # the details (the name of the indicator that is down) are only for the
      # administrators — the anonymous client only sees the status
      show-details: when_authorized
      show-components: when_authorized

info:
  app:
    name: UltiBiz
    version: 0.1.0-SNAPSHOT

ultibiz:
  admin:
    password: ${ULTIBIZ_ADMIN_PASSWORD:}
  exchange:
    # shared secret the partners send in the X-Exchange-Secret header
    webhook-secret: ${ULTIBIZ_EXCHANGE_WEBHOOK_SECRET:}
    retry-delay-ms: ${ULTIBIZ_EXCHANGE_RETRY_DELAY_MS:60000}
  mail:
    # the sender address of the report e-mail
    from: ${ULTIBIZ_SMTP_FROM:ultibiz@localhost}
    # the relay of the environment (the fallback when the organisation has no
    # settings of its own)
    smtp:
      host: ${ULTIBIZ_SMTP_HOST:}
      port: ${ULTIBIZ_SMTP_PORT:587}
      user: ${ULTIBIZ_SMTP_USER:}
      password: ${ULTIBIZ_SMTP_PASSWORD:}
    # an API provider instead of SMTP: mandrill | sendgrid | mailgun | webhook
    provider: ${ULTIBIZ_EMAIL_PROVIDER:}
    mandrill:
      api-key: ${ULTIBIZ_MANDRILL_API_KEY:}
    sendgrid:
      api-key: ${ULTIBIZ_SENDGRID_API_KEY:}
    mailgun:
      domain: ${ULTIBIZ_MAILGUN_DOMAIN:}
      api-key: ${ULTIBIZ_MAILGUN_API_KEY:}
      region: ${ULTIBIZ_MAILGUN_REGION:us}
    webhook:
      url: ${ULTIBIZ_EMAIL_WEBHOOK_URL:}
      secret: ${ULTIBIZ_EMAIL_WEBHOOK_SECRET:}
  rate-limit:
    # the public endpoints (customer portal, inbound webhook) are limited
    requests: ${ULTIBIZ_RATE_LIMIT_REQUESTS:60}
    window-seconds: ${ULTIBIZ_RATE_LIMIT_WINDOW:60}
  dashboard:
    # where the scheduled reports are written
    report-dir: ${ULTIBIZ_REPORT_DIR:/home/janedoe/ultibiz-reports}
    # optional webhook that receives the generated report (empty = file only)
    delivery-webhook: ${ULTIBIZ_DASHBOARD_DELIVERY_WEBHOOK:}
  ai:
    # the key that encrypts the AI provider keys (AES); without it no key is stored
    encryption-key: ${ULTIBIZ_AI_ENCRYPTION_KEY:}
  tenant:
    # single = one database for every organisation (the default, the behaviour
    # of the single-tenant installation); database = one database per tenant,
    # the connection of a request goes to the database of its organisation
    mode: ${ULTIBIZ_TENANT_MODE:single}
    # the control database (the identity and the registry)
    control-database: ${ULTIBIZ_DB_NAME:ultibiz}
    application-user: ${ULTIBIZ_DB_USER:ultibiz}
    application-password: ${ULTIBIZ_DB_PASSWORD:}
    # the administrator of the MariaDB server (creates the tenant databases)
    admin-user: ${ULTIBIZ_DB_ADMIN_USER:root}
    admin-password: ${ULTIBIZ_DB_ADMIN_PASSWORD:${MARIADB_ROOT_PASSWORD:}}
    admin-host: ${ULTIBIZ_DB_HOST:localhost}
    admin-port: ${ULTIBIZ_DB_PORT:3311}

logging:
  level:
    root: info
    com.ultibiz: info
