# The single sign-on (Keycloak). The profile is switched on with
# SPRING_PROFILES_ACTIVE=sso — without it the application behaves exactly as
# before (the local form login, no OAuth2 client).

server:
  # the application sits behind the reverse proxy of erp.example.com:
  # the redirect URI of the identity provider must be the public URL
  forward-headers-strategy: framework

spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${ULTIBIZ_SSO_CLIENT_ID:ultibiz}
            client-secret: ${ULTIBIZ_SSO_CLIENT_SECRET:}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: ${ULTIBIZ_SSO_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            client-name: Keycloak
        provider:
          keycloak:
            issuer-uri: ${ULTIBIZ_SSO_ISSUER:}

ultibiz:
  sso:
    # a user that does not exist yet may be created on the first login
    auto-provision: ${ULTIBIZ_SSO_AUTO_PROVISION:true}
    # the organisation and the role of a new user (the roles of the base
    # scheme are ADMIN and USER — a role that does not exist is reported in
    # the log, the user then logs in without any permission)
    default-organization: ${ULTIBIZ_SSO_ORGANIZATION:ACME}
    default-role: ${ULTIBIZ_SSO_ROLE:USER}
    # the roles of the identity provider that make an administrator
    admin-roles: ${ULTIBIZ_SSO_ADMIN_ROLES:ultibiz-admin,admin}
